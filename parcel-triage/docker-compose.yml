version: '3.8'

services:
  # Next.js application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://parcel_user:parcel_password@postgis:5432/parcel_triage
    depends_on:
      - postgis
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped

  # PostGIS database (for production/scaling)
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_USER=parcel_user
      - POSTGRES_PASSWORD=parcel_password
      - POSTGRES_DB=parcel_triage
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./scripts/init-postgis.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # Optional: PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@parceltriage.local
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgis
    restart: unless-stopped
    profiles:
      - dev

volumes:
  postgis_data:
